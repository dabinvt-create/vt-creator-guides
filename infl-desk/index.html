<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>인플루언서 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 메신저 구조: 왼쪽 채팅방 목록, 오른쪽 대화. 폰에서는 목록과 대화를 번갈아 한 화면씩 */
  /* VT 톤: 실버 그래파이트 모노톤 + 민트 포인트 (가이드 데스크와 같은 민트 #2FC0BC). 초록 계열 쓰지 말 것 */
  :root{
    --rail:#262C31; --railink:#8C969E; --railon:#FFFFFF;
    --list:#FBFCFD; --listhover:#F1F4F6; --listsel:#E6EBEE; --line:#DDE3E7;
    --ink:#1F262C; --ink2:#69737C; --ink3:#AEB6BD;
    --room:#E4E9ED; --mine:#BCEDEA; --mineink:#123B3A; --other:#FFFFFF; --otherink:#1F262C;
    --badge:#13A6A2; --head:linear-gradient(180deg,#FBFCFD,#EEF1F4); --input:#FBFCFD; --field:#EEF1F4;
    --mint:#2FC0BC; --mintink:#0A6A67; --send:#13A6A2; --mintsoft:#DEF4F3; --gpt:#4F5962;
    --meta:#69737C; --chip:rgba(79,89,98,.14); --chipink:#4F5962; --dot:#AEB6BD;
    --body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --rail:#0F1215; --railink:#6B747C; --railon:#E6EAEE;
    --list:#1B2025; --listhover:#20262C; --listsel:#262D33; --line:#2E353C;
    --ink:#E6EAEE; --ink2:#949DA6; --ink3:#59626A;
    --room:#14181C; --mine:#1F6F6B; --mineink:#F2FBFA; --other:#232A30; --otherink:#E6EAEE;
    --badge:#3FD3CF; --head:linear-gradient(180deg,#20262C,#1B2025); --input:#1B2025; --field:#232A30;
    --mintink:#7FE3DF; --send:#1A8F8B; --mintsoft:#123331; --gpt:#B3BBC2; --meta:#949DA6; --chip:rgba(230,234,238,.1); --chipink:#B3BBC2; --dot:#59626A; color-scheme:dark}}
  :root[data-theme="dark"]{
    --rail:#0F1215; --railink:#6B747C; --railon:#E6EAEE;
    --list:#1B2025; --listhover:#20262C; --listsel:#262D33; --line:#2E353C;
    --ink:#E6EAEE; --ink2:#949DA6; --ink3:#59626A;
    --room:#14181C; --mine:#1F6F6B; --mineink:#F2FBFA; --other:#232A30; --otherink:#E6EAEE;
    --badge:#3FD3CF; --head:linear-gradient(180deg,#20262C,#1B2025); --input:#1B2025; --field:#232A30;
    --mintink:#7FE3DF; --send:#1A8F8B; --mintsoft:#123331; --gpt:#B3BBC2; --meta:#949DA6; --chip:rgba(230,234,238,.1); --chipink:#B3BBC2; --dot:#59626A; color-scheme:dark}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--list);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--mintink);outline-offset:2px}
  textarea:focus{outline:none;border-color:var(--ink3)}

  .app{display:grid;grid-template-columns:64px 340px minmax(0,1fr);height:100dvh}
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0}
  .rail button{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--railink);display:grid;place-items:center}
  .rail button[aria-pressed="true"]{color:var(--railon);background:rgba(47,192,188,.25)}
  .rail svg{width:24px;height:24px}
  .rail .grow{flex:1}

  .list{background:var(--list);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .lhead{padding:20px 18px 10px;display:flex;align-items:center;gap:10px}
  .lhead h1{margin:0;flex:1;display:grid;gap:6px;min-width:0}
  .lhead h1 span{font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:-.01em}
  .logo{height:18px;width:auto;display:block}
  .logo.big{height:24px;margin-bottom:6px}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
  :root[data-theme="dark"] .logo{filter:invert(1)}
  .iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
  .iconbtn:hover{background:var(--listhover)}
  .iconbtn svg{width:22px;height:22px}
  .search{margin:0 18px 8px;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:10px;padding:8px 12px;color:var(--ink2)}
  .search input{border:0;background:transparent;font:inherit;color:var(--ink);flex:1;min-width:0;outline:none}
  .search svg{width:17px;height:17px;flex:none}
  .seg{display:flex;gap:6px;padding:4px 18px 10px}
  .seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink2)}
  .seg button[aria-pressed="true"]{background:var(--rail);border-color:var(--rail);color:#fff}
  .rooms{flex:1;overflow:auto}
  .room{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 18px}
  .room:hover{background:var(--listhover)} .room[aria-current="true"]{background:var(--listsel)}
  .av{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#2B2B2B;flex:none}
  .av.sm{width:40px;height:40px;border-radius:15px;font-size:15px}
  .room .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .room .pv{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .room .rt{display:grid;justify-items:end;gap:5px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
  .badge{min-width:20px;height:20px;border-radius:10px;background:var(--badge);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 6px}
  .wait{font-size:11px;color:var(--mintink);font-weight:700}
  .empty{padding:28px 18px;color:var(--ink2);font-size:13.5px}

  .chat{display:flex;flex-direction:column;min-width:0;background:var(--room)}
  .chead{background:var(--head);padding:16px 22px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .chead .tt{flex:1;min-width:0}
  .chead h2{margin:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chead .st{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{display:none}
  .gptbtn{border:0;color:#fff;background:var(--gpt);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:center}
  .gptbtn svg{width:16px;height:16px}
  .gptbtn:disabled{opacity:.45;cursor:default}
  .msgs{flex:1;overflow:auto;padding:18px 22px 10px;display:flex;flex-direction:column;gap:6px}
  .day{align-self:center;background:var(--chip);color:var(--chipink);font-size:12px;border-radius:999px;padding:3px 12px;margin:8px 0}
  .row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
  .row.mine{justify-content:flex-end}
  .row .col{display:grid;gap:4px;min-width:0;max-width:min(78%,760px)}
  .row.wide .col{max-width:min(92%,900px)}
  .row .who{font-size:12.5px;color:var(--meta)}
  :root[data-theme="dark"] .row .who{color:#C9D3DC}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row .who{color:#C9D3DC}}
  .row .avs{align-self:flex-start}
  .row.cont .avs{visibility:hidden}
  .row.cont .who{display:none}
  .line{display:flex;gap:6px;align-items:flex-end;min-width:0}
  .line .b{flex:0 1 auto;max-width:100%}
  .row.mine .line{flex-direction:row-reverse}
  .tm{font-size:11px;color:var(--meta);white-space:nowrap;flex:none}
  :root[data-theme="dark"] .tm{color:#AEB9C3}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tm{color:#AEB9C3}}
  .b{padding:8px 12px;border-radius:14px;overflow-wrap:anywhere;min-width:0;font-size:14.5px}
  .row.mine .b{background:var(--mine);color:var(--mineink);border-top-right-radius:4px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(31,38,44,.08)}
  .row.other .b{box-shadow:0 1px 1px rgba(31,38,44,.06)}
  .row.other .b{background:var(--other);color:var(--otherink);border-top-left-radius:4px}
  .row.plain .b{white-space:pre-wrap}
  .row.pending .b{opacity:.55}
  .b p{margin:0 0 6px} .b p:last-child{margin:0}
  .b h4{margin:8px 0 4px;font-size:14.5px}
  .b ul,.b ol{margin:0 0 6px;padding-left:20px}
  .b a{color:var(--mintink);font-weight:700}
  .row.gpt .b{border-left:3px solid var(--gpt)}
  .askgpt{justify-self:start;border:1px solid var(--line);background:var(--other);color:var(--gpt);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700;display:flex;gap:5px;align-items:center}
  .askgpt svg{width:14px;height:14px}
  .typing{display:flex;gap:4px;padding:12px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--dot);display:block}
  @media (prefers-reduced-motion:no-preference){.typing i{animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
    @keyframes bl{0%,60%,100%{opacity:.35}30%{opacity:1}}}
  .prog{font-size:12px;color:var(--mintink);font-weight:500}
  .tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:10px;margin:6px 0;max-height:460px}
  .tw table{border-collapse:collapse;font-size:13px;min-width:100%}
  .tw th,.tw td{border-bottom:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top;white-space:nowrap}
  .tw td.wrap{white-space:normal;min-width:220px}
  .tw th{position:sticky;top:0;background:var(--mintsoft);font-weight:700}
  .tw td.num{font-variant-numeric:tabular-nums}
  .tbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);margin:2px 0 6px;flex-wrap:wrap}
  .tbar button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:center}
  .tbar svg{width:15px;height:15px}

  .composer{background:var(--input);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:flex-end}
  .composer textarea{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 14px;resize:none;min-height:44px;max-height:180px;line-height:1.45}
  .send{border:0;background:var(--send);color:#fff;font-weight:700;border-radius:12px;padding:0 20px;height:44px}
  .send:disabled{opacity:.5;cursor:default}
  .note{font-size:12px;color:var(--meta);text-align:center;padding:2px 12px 8px;background:var(--room)}
  .nochat{flex:1;display:grid;place-items:center;color:var(--meta);text-align:center;padding:24px}
  .nochat b{display:block;font-size:17px;margin-bottom:6px;color:var(--ink)}
  .hint{display:flex;flex-direction:column;gap:6px;margin-top:14px;align-items:center}
  .hint button{border:1px solid var(--line);background:var(--other);color:var(--otherink);border-radius:14px;padding:8px 14px;font-size:13.5px;max-width:420px;text-align:left}

  .gate{max-width:360px;margin:12vh auto 0;padding:26px;display:grid;gap:12px;background:var(--list);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  .gatebg{min-height:100dvh;background:linear-gradient(180deg,var(--room),var(--listsel));padding:16px;overflow:auto}
  .gate h1{margin:0;font-size:21px}
  .gate .sub{font-size:13px;color:var(--ink2)}
  .gate label{display:grid;gap:4px;font-size:12.5px;color:var(--ink2)}
  .gate input{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .gate .send{width:100%}
  .err{font-size:12.5px;color:var(--badge);min-height:1em}

  @media (max-width:820px){
    .app{grid-template-columns:minmax(0,1fr)}
    .rail{display:none}
    .app[data-view="chat"] .list{display:none}
    .app[data-view="list"] .chat{display:none}
    .back{display:grid}
    .chead{padding:12px 12px 10px}
    .msgs{padding:14px 12px 8px}
    .row .col{max-width:86%} .row.wide .col{max-width:94%}
    .gptbtn span.l{display:none}
  }
</style>
</head>

    var cp = el("button",""); cp.type = "button"; cp.appendChild(svg('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>')); var cpt = document.createTextNode("시트에 붙이기"); cp.appendChild(cpt);
    cp.onclick = function(){ var s = [head].concat(body).map(function(r){ return r.map(function(v){ return clean(v).replace(/\t|\n/g," "); }).join("\t"); }).join("\n");
      navigator.clipboard.writeText(s).then(function(){ cpt.textContent = "복사됐어요, 시트에 붙여 넣으세요"; setTimeout(function(){ cpt.textContent = "시트에 붙이기"; }, 2000); }); };
    bar.appendChild(csv); bar.appendChild(cp); bar.appendChild(el("span","", body.length+"명"));
    frag.appendChild(bar);
    return frag;
  }
  function rich(text, box){
    var lines = String(text).split("\n"), i = 0, n = 0, para = [], list = null, hasTable = false;
    function flush(){ if (para.length){ var p = el("p",""); para.forEach(function(l, k){ if (k) p.appendChild(document.createElement("br")); inline(p, l); }); box.appendChild(p); para = []; } list = null; }
    while (i < lines.length){
      var l = lines[i];
      if (/^\s*\|.*\|\s*$/.test(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
        flush(); var head = cells(l), body = []; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ body.push(cells(lines[i])); i++; }
        box.appendChild(table(head, body, ++n)); hasTable = true; continue;
      }
      if (/^#{1,4}\s/.test(l)){ flush(); var h = el("h4",""); inline(h, l.replace(/^#+\s*/,"")); box.appendChild(h); i++; continue; }
      if (/^\s*[-*]\s+/.test(l)){ if (para.length) flush(); if (!list){ list = el("ul",""); box.appendChild(list); } var li = el("li",""); inline(li, l.replace(/^\s*[-*]\s+/,"")); list.appendChild(li); i++; continue; }
      if (!l.trim()){ flush(); i++; continue; }
      list = null; para.push(l); i++;
    }
    flush(); return hasTable;
  }

  // 목록
  function visible(){
    var q = $("q").value.trim().toLowerCase();
    return rooms.filter(function(r){
      if (scope === "me" && ownerOf(r) !== me.name) return false;
      return !q || ((r.title||"")+" "+(r.lastText||"")+" "+ownerOf(r)).toLowerCase().indexOf(q) >= 0;
    });
  }
  function unread(r){ return r.lastFrom !== "member" && r.updatedAt > (seen[r.id] || 0) && sel !== r.id; }
  function renderScope(){
    [["s-me","me"],["s-all","all"],["r-me","me"],["r-all","all"]].forEach(function(x){ $(x[0]).setAttribute("aria-pressed", String(scope===x[1])); });
  }
  function renderRooms(){
    var box = $("rooms"); box.textContent = "";
    var list = visible();
    if (!list.length){ box.appendChild(el("p","empty", scope==="me" ? "아직 내 채팅이 없어요. 위 말풍선 버튼을 누르거나 오른쪽에 바로 물어보세요." : "맞는 채팅방이 없어요.")); return; }
    list.forEach(function(r){
      var b = el("button","room"); b.type = "button"; b.setAttribute("aria-current", String(sel===r.id));
      b.appendChild(avatar(ownerOf(r)));
      var mid = el("span",""); mid.appendChild(el("span","nm", r.title || "새 채팅"));
      var pv = r.needsClaude ? (r.progress || "답을 쓰고 있어요") : String(r.lastText || "").replace(/\*\*/g,"").replace(/\|[\s:|-]*\|/g," ").replace(/\|/g," ").replace(/\s+/g," ");
      mid.appendChild(el("span","pv", (scope==="all" ? ownerOf(r)+"  " : "") + pv)); b.appendChild(mid);
      var rt = el("span","rt"); rt.appendChild(el("span","", when(r.updatedAt)));
      if (r.needsClaude) rt.appendChild(el("span","wait","답 쓰는 중"));
      else if (unread(r)) rt.appendChild(el("span","badge","N"));
      b.appendChild(rt);
      b.onclick = function(){ openRoom(r.id); };
      box.appendChild(b);
    });
  }

  // 대화
  function cur(){ return rooms.find(function(x){ return x.id===sel; }); }
  function renderHead(){
    var r = cur();
    $("chead").hidden = false;
    $("ctitle").textContent = r ? (r.title || "채팅") : "새 채팅";
    $("csub").textContent = r ? (ownerOf(r) + " 님 채팅방" + (r.needsClaude && r.progress ? "  " + r.progress : "")) : "질문을 적으면 방이 열려요";
    var hasAnswer = msgs.some(function(m){ return m.from==="claude"; });
    $("gptbtn").disabled = !r || !hasAnswer || r.needsClaude;
    $("gptbtn").title = !hasAnswer ? "Claude 답이 온 뒤에 누를 수 있어요" : r && r.needsClaude ? "지금 답을 쓰는 중이에요" : "GPT 가 원본 데이터로 Claude 답을 다시 확인해요";
  }
  function bubble(m, prev){
    var kind = m.from==="claude" || m.from==="gpt" ? "bot" : isMine(m) ? "mine" : "other";
    var sameAuthor = prev && prev.from === m.from && prev.fromName === m.fromName && Math.abs(m.at - prev.at) < 300000 && kind !== "mine";
    var row = el("div","row "+(kind==="mine"?"mine":"other")+(m.from==="gpt"?" gpt":"")+(sameAuthor?" cont":"")+(m.pending?" pending":""));
    var b = el("div","b");
    if (kind === "bot"){ if (rich(m.text, b)) row.classList.add("wide"); } else { row.classList.add("plain"); b.textContent = m.text; }
    if (kind !== "mine"){
      var nm = m.from==="claude" ? "Claude" : m.from==="gpt" ? "GPT" : (m.fromName||"팀원");
      var av = avatar(nm, "sm avs", m.from==="claude" ? "#2FC0BC" : m.from==="gpt" ? "#4F5962" : null);
      if (m.from==="gpt" || m.from==="claude") av.style.color = "#fff";
      row.appendChild(av);
      var col = el("div","col"); col.appendChild(el("span","who", nm));
    } else var col = el("div","col");
    var line = el("div","line"); line.appendChild(b); line.appendChild(el("span","tm", m.pending ? "보내는 중" : ampm(new Date(Number(m.at)))));
    col.appendChild(line);
    if (m.askgpt){ var g = el("button","askgpt"); g.type = "button"; g.appendChild(svg('<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>')); g.appendChild(document.createTextNode("GPT에게 검토받기")); g.onclick = askGpt; col.appendChild(g); }
    row.appendChild(col);
    return row;
  }
  function renderMsgs(){
    var box = $("msgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80; box.textContent = "";
    var all = msgs.concat(pend), prev = null, lastDay = "";
    $("nochat").hidden = !!(all.length || (sel && !draft));
    box.hidden = !$("nochat").hidden;
    // 마지막 Claude 답 아래에 GPT 검토 바로가기 (그 뒤에 검토 요청이나 GPT 답이 없을 때만)
    var rr = cur(), lc = -1;
    all.forEach(function(m, k){ m.askgpt = false; if (m.from === "claude") lc = k; });
    if (lc >= 0 && rr && !rr.needsClaude && !all.slice(lc + 1).some(function(m){ return m.from === "gpt" || m.text === GPT_ASK; })) all[lc].askgpt = true;
    all.forEach(function(m){
      var d = m.pending ? "" : new Date(Number(m.at)).toDateString();
      if (d && d !== lastDay){ box.appendChild(el("div","day", dayLabel(m.at))); lastDay = d; prev = null; }
      box.appendChild(bubble(m, prev)); prev = m;
    });
    var r = cur();
    if (r && r.needsClaude && !pend.length){
      // 마지막 팀원 글이 GPT 검토 요청이면 GPT 가 쓰는 중
      var lastMember = all.filter(function(m){ return m.from !== "claude" && m.from !== "gpt"; }).pop();
      var byGpt = lastMember && lastMember.text === GPT_ASK, who = byGpt ? "GPT" : "Claude";
      var row = el("div","row other"); var av = avatar(who,"sm avs", byGpt ? "#4F5962" : "#2FC0BC"); av.style.color = "#fff"; row.appendChild(av);
      var col = el("div","col"); col.appendChild(el("span","who",who));
      var t = el("div","b typing"); t.appendChild(el("i")); t.appendChild(el("i")); t.appendChild(el("i")); col.appendChild(t);
      if (r.progress) col.appendChild(el("span","prog", r.progress));
      row.appendChild(col); box.appendChild(row);
    }
    if (atBottom || pend.length) box.scrollTop = box.scrollHeight;
  }
  function markSeen(){ var r = cur(); if (r){ seen[r.id] = Math.max(r.updatedAt || 0, Date.now()); lsj("idesk-seen", seen); } }

  async function loadMsgs(reset){
    if (!sel) return; var id = sel;
    if (reset){ msgs = []; lastAt = 0; }
    try {
      var j = await get("msgs", "&caseId="+encodeURIComponent(id)+"&since="+lastAt);
      if (id !== sel) return;
      if (j.msgs.length || reset){
        var have = {}; msgs.forEach(function(m){ have[m.id] = 1; });
        j.msgs.forEach(function(m){ if (!have[m.id]) msgs.push(m); if (m.at > lastAt) lastAt = m.at; });
        renderMsgs(); renderHead(); markSeen();
      }
    } catch(e){ if (reset){ $("msgs").textContent = ""; $("msgs").appendChild(el("p","empty","대화를 불러오지 못했어요. 잠시 뒤 자동으로 다시 시도해요.")); } }
  }
  async function loadRooms(){
    try {
      var j = await get("cases"); rooms = j.cases;
      renderRooms(); if (sel){ renderHead(); renderMsgs(); }
      return true;
    } catch(e){
      if (String(e.message)==="passcode"){ logout("암호가 바뀌었어요. 다시 적어 주세요."); return false; }
      if (!rooms.length){ $("rooms").textContent = ""; $("rooms").appendChild(el("p","empty","목록을 불러오지 못했어요. 잠시 뒤 자동으로 다시 시도해요.")); }
      return false;
    }
  }
  function openRoom(id){
    sel = id; draft = false; pend = []; msgs = [];
    $("app").dataset.view = "chat"; renderRooms(); renderHead();
    $("msgs").hidden = false; $("nochat").hidden = true; $("msgs").textContent = ""; $("msgs").appendChild(el("p","empty","불러오는 중"));
    loadMsgs(true); $("input").focus();
  }
  function newRoom(){
    sel = null; draft = true; msgs = []; pend = [];
    $("app").dataset.view = "chat"; renderRooms(); renderHead(); renderMsgs(); $("input").focus();
  }
  function renderHints(){
    var box = $("hints"); box.textContent = "";
    HINTS.forEach(function(h){ var b = el("button","",h); b.type = "button"; b.onclick = function(){ if (!sel) draft = true; renderHead(); $("input").value = h; grow(); $("input").focus(); }; box.appendChild(b); });
  }

  async function send(t){
    var p = {from:me.id, fromName:me.name, text:t, pending:true, at:Date.now()};
    pend.push(p); renderMsgs(); $("sendbtn").disabled = true;
    try {
      if (!sel){
        var j = await post({action:"newCase", owner:me.name, kind:"", question:t, from:me.id});
        sel = j.id; draft = false; pend = []; scope = scope === "all" ? "all" : "me";
        await loadRooms(); await loadMsgs(true);
      } else {
        await post({action:"sendMsg", caseId:sel, from:me.id, fromName:me.name, text:t});
        pend = pend.filter(function(x){ return x !== p; });
        var r = cur(); if (r){ r.needsClaude = true; r.lastFrom = "member"; r.lastText = t; }
        await loadMsgs(false); renderRooms(); renderHead();
      }
      return true;
    } catch(err){
      pend = pend.filter(function(x){ return x !== p; }); renderMsgs();
      alert("보내지 못했어요. 잠시 뒤 다시 보내 주세요.");
      return false;
    } finally { $("sendbtn").disabled = false; }
  }
  function grow(){ var t = $("input"); t.style.height = "auto"; t.style.height = Math.min(180, t.scrollHeight + 2) + "px"; }
  $("input").addEventListener("input", grow);
  $("composer").addEventListener("submit", async function(e){
    e.preventDefault(); var t = $("input").value.trim(); if (!t) return;
    $("input").value = ""; grow();
    if (!await send(t)) { $("input").value = t; grow(); }
    $("input").focus();
  });
  // 엔터 = 보내기, 시프트+엔터 = 줄바꿈 (한글 조합 중에는 무시)
  $("input").addEventListener("keydown", function(e){ if (e.key==="Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
  $("gptbtn").onclick = askGpt;
  async function askGpt(){
    if (!sel || $("gptbtn").disabled){ alert("Claude 답이 온 뒤에 누를 수 있어요."); return; }
    if (!confirm("GPT 에게 이 방의 마지막 답 검토를 맡길까요? 몇 분 걸려요.")) return;
    $("gptbtn").disabled = true; await send(GPT_ASK);
  };
  $("newbtn").onclick = newRoom;
  $("back").onclick = function(){ $("app").dataset.view = "list"; sel = null; draft = false; renderRooms(); };
  function setScope(s){ scope = s; ls("idesk-scope", s); renderScope(); renderRooms(); }
  $("s-me").onclick = $("r-me").onclick = function(){ setScope("me"); };
  $("s-all").onclick = $("r-all").onclick = function(){ setScope("all"); };
  $("q").addEventListener("input", renderRooms);

  var timer = null;
  function tick(){ if (document.visibilityState === "hidden") return; loadRooms(); loadMsgs(false); }
  async function start(){
    $("gatebg").hidden = true; $("app").hidden = false; renderScope(); renderHints(); renderHead(); renderMsgs();
    if (!await loadRooms()) return;
    clearInterval(timer); timer = setInterval(tick, 4000);
  }
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && me.key) tick(); });
  function logout(msg){
    clearInterval(timer); ls("idesk-key", null); me.key = "";
    $("app").hidden = true; $("gatebg").hidden = false; $("g-name").value = me.name; $("g-status").textContent = msg || "";
  }
  $("logout").onclick = function(){ if (confirm("이름이나 암호를 다시 적을까요?")) logout(""); };
  $("gate").addEventListener("submit", async function(e){
    e.preventDefault(); me.name = $("g-name").value.trim(); me.key = $("g-key").value.trim(); if (!me.name || !me.key) return;
    $("g-btn").disabled = true; $("g-status").textContent = "";
    try { await get("ping"); ls("idesk-name", me.name); ls("idesk-key", me.key); start(); }
    catch(err){ $("g-status").textContent = String(err.message)==="passcode" ? "암호가 맞지 않아요." : "연결하지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
    $("g-btn").disabled = false;
  });
  if (me.key && me.name) start(); else logout("");
})();
